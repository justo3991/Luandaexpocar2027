name: Validate LEC Website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate the 26-page website
        run: npm run build
      - name: Verify official assets and core pages
        run: |
          test -f dist/index.html
          test -f dist/privacidade.html
          test -f dist/amplifica.html
          test -f dist/recinto.html
          test -f dist/ceo-justo-eliseu.webp
          if grep -R -l 'src="/lec-logo-official.png"' dist/*.html; then
            echo "Unexpected official logo reference in current text-branding release"
            exit 1
          fi
