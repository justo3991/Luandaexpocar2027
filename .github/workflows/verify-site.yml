name: Verify LEC website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and verify 23 pages
        run: npm run build
      - name: Check output
        run: |
          test -f dist/index.html
          test -f dist/contactos.html
          test -f dist/site.css
          test -f dist/sitemap.xml
